# D15 fix: the db reports when it is READY, and app waits for that.
name: d15

services:
  db:
    image: postgres:16.15-alpine
    container_name: d15-db-1
    environment:
      POSTGRES_PASSWORD: change-me-123
    # Keep the scratch data in memory, so nothing is left behind on your disk.
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
      interval: 2s
      retries: 15
    labels:
      z2h.scenario: d15

  app:
    image: python:3.12-alpine
    container_name: d15-app-1
    command: ["python", "/app/app.py"]
    volumes:
      - ./app.py:/app/app.py:ro
    ports:
      - "8115:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    labels:
      z2h.scenario: d15

networks:
  default:
    labels:
      z2h.scenario: d15
