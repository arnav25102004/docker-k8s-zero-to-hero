<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Make your own QR code</title>
<style>
  body { margin: 0; padding: 24px; font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; text-align: center; }
  h1 { font-size: 44px; margin: 8px 0 20px; }
  input { width: min(90%, 640px); font-size: 26px; padding: 12px 16px; border-radius: 10px; border: 3px solid #38bdf8; }
  #qr { display: inline-block; background: #fff; padding: 16px; border-radius: 16px; margin: 24px 0 8px; }
  #qr svg { display: block; width: min(80vw, 360px); height: auto; }
  p { font-size: 24px; margin: 8px; }
  small { color: #94a3b8; font-size: 16px; }
</style>
</head>
<body>
  <h1>Make your own QR code 🔳</h1>
  <input id="text" value="https://github.com/your-username" autofocus aria-label="Text or URL for the QR code">
  <div><div id="qr"></div></div>
  <p>📱 Tip: scan it with your phone camera!</p>
  <small>Everything happens in your browser. Nothing is sent anywhere.</small>
  <script src="qrcode.min.js"></script>
  <script>
    var box = document.getElementById('text');
    var out = document.getElementById('qr');
    function draw() {
      var qr = qrcode(0, 'M');
      qr.addData(box.value || ' ');
      qr.make();
      out.innerHTML = qr.createSvgTag({ cellSize: 8, margin: 0, scalable: true });
    }
    box.addEventListener('input', draw);
    draw();
  </script>
</body>
</html>
