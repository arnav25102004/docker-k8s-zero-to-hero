apiVersion: v1
kind: Namespace
metadata:
  name: netpol-lab
---
apiVersion: v1
kind: Pod
metadata: { name: redis, namespace: netpol-lab, labels: { app: redis } }
spec:
  containers: [ { name: redis, image: "redis:7.4.12-alpine", ports: [ { containerPort: 6379 } ] } ]
---
apiVersion: v1
kind: Service
metadata: { name: redis, namespace: netpol-lab }
spec:
  selector: { app: redis }
  ports: [ { port: 6379 } ]
---
apiVersion: v1
kind: Pod
metadata: { name: api, namespace: netpol-lab, labels: { app: api } }
spec:
  containers:
    - name: api
      image: z2h/api:1.0
      imagePullPolicy: IfNotPresent
      env: [ { name: REDIS_HOST, value: redis } ]
      ports: [ { containerPort: 8080 } ]
---
apiVersion: v1
kind: Service
metadata: { name: api, namespace: netpol-lab }
spec:
  selector: { app: api }
  ports: [ { port: 8080 } ]
---
# Plays the role of the frontend.
apiVersion: v1
kind: Pod
metadata: { name: frontend, namespace: netpol-lab, labels: { app: frontend } }
spec:
  containers: [ { name: c, image: "busybox:1.36", command: ["sleep", "3600"] } ]
---
# An "attacker" Pod: something compromised inside the cluster.
apiVersion: v1
kind: Pod
metadata: { name: intruder, namespace: netpol-lab, labels: { app: intruder } }
spec:
  containers: [ { name: c, image: "busybox:1.36", command: ["sleep", "3600"] } ]
