# K16 fix: the same game, now with a toleration for the VIP taint.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: game
  namespace: k-16-vip-node
spec:
  replicas: 2
  selector:
    matchLabels:
      app: game
  template:
    metadata:
      labels:
        app: game
    spec:
      tolerations:
        - key: z2h-vip
          operator: Equal
          value: "true"
          effect: NoSchedule
      containers:
        - name: game
          image: nginx:1.27.5-alpine
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
          volumeMounts:
            - name: page
              mountPath: /usr/share/nginx/html
      volumes:
        - name: page
          configMap:
            name: dosa-dash-page
---
apiVersion: v1
kind: Service
metadata:
  name: game
  namespace: k-16-vip-node
spec:
  selector:
    app: game
  ports:
    - port: 80
      targetPort: 80
