# K16 break (3/3): a small visitor that asks for the game every 2 seconds: the live signal on stage.
apiVersion: v1
kind: Pod
metadata:
  name: visitor
  namespace: k-16-vip-node
spec:
  # The visitor is the player, not the game: it carries the toleration from the start.
  # Without it the visitor would be refused by the same taint and would never even start,
  # so the room would have nothing to watch. Only the game Deployment lacks it.
  tolerations:
    - key: z2h-vip
      operator: Equal
      value: "true"
      effect: NoSchedule
  containers:
    - name: visitor
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          while true; do
            if wget -q -T 2 -O /dev/null http://game 2>/dev/null; then
              echo "✅ $(date +%T) HTTP 200"
            else
              echo "❌ $(date +%T) no answer from http://game"
            fi
            sleep 2
          done
