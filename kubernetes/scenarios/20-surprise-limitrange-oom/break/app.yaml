# K20 break: the Cats vs Dogs app with NO resources section at all. Nobody wrote a memory limit.
# The app itself needs about 16Mi to run. This Deployment's start command also loads a
# "vote history" (40 MiB of filler, standing in for a cache) into memory before the app
# starts, so the whole Pod needs roughly 56Mi: more than the 32Mi the LimitRange hands out.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: showdown
  namespace: k-20-limitrange
spec:
  replicas: 2
  selector:
    matchLabels:
      app: showdown
  template:
    metadata:
      labels:
        app: showdown
    spec:
      containers:
        - name: showdown
          image: python:3.12-alpine
          command:
            - python
            - -c
            - |
              import runpy
              # Load the vote history into memory at start (40 MiB; every byte is touched, so it is really used).
              vote_history = bytearray(b"x") * (40 * 1024 * 1024)
              runpy.run_path("/app/app.py", run_name="__main__")
          env:
            - name: PORT
              value: "8080"
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            periodSeconds: 2
          volumeMounts:
            - name: code
              mountPath: /app
              readOnly: true
      volumes:
        - name: code
          configMap:
            name: showdown-code
            items:
              - key: app.py
                path: app.py
              - key: index.html
                path: static/index.html
---
apiVersion: v1
kind: Service
metadata:
  name: showdown
  namespace: k-20-limitrange
spec:
  selector:
    app: showdown
  ports:
    - port: 80
      targetPort: 8080
