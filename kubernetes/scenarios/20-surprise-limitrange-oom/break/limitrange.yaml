# K20 break: settings for the namespace, set by the "platform team".
# (In this YAML, `default` is the default LIMIT and `defaultRequest` is the default request.)
apiVersion: v1
kind: LimitRange
metadata:
  name: default-memory
  namespace: k-20-limitrange
spec:
  limits:
    - type: Container
      defaultRequest:
        memory: 16Mi
      default:
        memory: 32Mi
