# K24 break: the Cats vs Dogs app, deployed.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: showdown
  namespace: k-24-wrong-command
spec:
  replicas: 1
  selector:
    matchLabels:
      app: showdown
  template:
    metadata:
      labels:
        app: showdown
    spec:
      containers:
        - name: showdown
          image: python:3.12-alpine
          command: ["pyhton", "/app/app.py"]
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
          volumeMounts:
            - name: code
              mountPath: /app
              readOnly: true
      volumes:
        - name: code
          configMap:
            name: showdown-code
            items:
              - key: app.py
                path: app.py
              - key: index.html
                path: static/index.html
---
apiVersion: v1
kind: Service
metadata:
  name: showdown
  namespace: k-24-wrong-command
spec:
  selector:
    app: showdown
  ports:
    - port: 80
      targetPort: 8080
