# A small visitor that asks the street-food stall every 2 seconds: the live signal on stage.
apiVersion: v1
kind: Pod
metadata:
  name: visitor
  namespace: k-15-statefulset
spec:
  terminationGracePeriodSeconds: 1
  tolerations:
    - operator: Exists
  containers:
    - name: visitor
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          while true; do
            r=$(wget -q -T 2 -O - http://stall 2>/dev/null)
            if [ -n "$r" ]; then
              echo "✅ $(date +%T) the street-food stall answers"
            else
              echo "❌ $(date +%T) no stall is open"
            fi
            sleep 2
          done
