# K28 fix: the same Job with the Redis host corrected.
apiVersion: batch/v1
kind: Job
metadata:
  name: leaderboard-reset
  namespace: k-28-job
spec:
  backoffLimit: 2          # retry twice, then give up (3 Pods in total)
  template:
    spec:
      restartPolicy: Never # a failed Pod stays around, so you can read its logs
      containers:
        - name: reset
          image: python:3.12-alpine
          command: ["python", "/script/reset.py"]
          env:
            - name: REDIS_HOST
              value: redis
          volumeMounts:
            - name: script
              mountPath: /script
      volumes:
        - name: script
          configMap:
            name: reset-script
