# K10: scenario manifest
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: board-data
  namespace: k-10-pvc-pending
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: fast-ssd
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: board
  namespace: k-10-pvc-pending
spec:
  replicas: 1
  selector:
    matchLabels:
      app: board
  template:
    metadata:
      labels:
        app: board
    spec:
      containers:
        - name: board
          image: kanboard/kanboard:v1.2.57
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /healthcheck.php
              port: 80
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/www/app/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: board-data
---
apiVersion: v1
kind: Service
metadata:
  name: board
  namespace: k-10-pvc-pending
spec:
  selector:
    app: board
  ports:
    - port: 80
      targetPort: 80
