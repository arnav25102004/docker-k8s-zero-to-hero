# K23 break (1/4): the code of the "Campus Today" page, kept in a ConfigMap so the scenario needs
# only the plain python image. It is mounted into the Pod at /app.
apiVersion: v1
kind: ConfigMap
metadata:
  name: theme-code
  namespace: k-23-dark-mode
data:
  app.py: |
    # Campus Today: a tiny notice page for the campus screens.
    import os
    import signal
    import sys
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
    
    THEME = os.environ.get("THEME", "light").strip().lower()
    if THEME != "dark":
        THEME = "light"
    PORT = int(os.environ.get("PORT", "8080"))
    
    PAGE = """<!doctype html>
    <html lang="en" data-theme="__THEME__">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Campus Today</title>
    <style>
      :root { --bg:#ffffff; --fg:#14171f; --card:#fff3b0; --edge:#f2b705; --accent:#d94f00; }
      [data-theme="dark"] { --bg:#070b1f; --fg:#eef2ff; --card:#18214d; --edge:#5ee7ff; --accent:#ff7ad9; }
      * { box-sizing:border-box; }
      body { margin:0; padding:32px 24px; background:var(--bg); color:var(--fg);
             font-family:system-ui,-apple-system,"Segoe UI",sans-serif; text-align:center; }
      .icon { font-size:120px; line-height:1; }
      h1 { font-size:56px; margin:8px 0 4px; color:var(--accent); }
      .badge { display:inline-block; margin:12px 0 28px; padding:8px 28px; border-radius:40px;
               border:4px solid var(--edge); font-size:28px; font-weight:800; letter-spacing:3px; }
      ul { list-style:none; margin:0 auto; padding:0; max-width:760px; text-align:left; }
      li { background:var(--card); border-left:12px solid var(--edge); border-radius:12px;
           margin:14px 0; padding:16px 22px; font-size:26px; }
      footer { margin-top:28px; font-size:18px; opacity:.75; }
    </style>
    </head>
    <body>
      <div class="icon">__ICON__</div>
      <h1>Campus Today</h1>
      <div class="badge">__LABEL__ THEME</div>
      <ul>
        <li>&#127835; <b>Canteen:</b> lemon rice and curd rice till 2 PM</li>
        <li>&#128218; <b>Library:</b> open till 10 PM in exam week</li>
        <li>&#127908; <b>Fest rehearsal:</b> Block 3 auditorium, 5 PM</li>
        <li>&#128652; <b>Last bus:</b> 8:30 PM from the main gate</li>
      </ul>
      <footer>Theme: __THEME__</footer>
    </body>
    </html>
    """
    
    ICON = "&#127774;" if THEME == "light" else "&#127769;"
    HTML = (PAGE.replace("__THEME__", THEME).replace("__ICON__", ICON)
            .replace("__LABEL__", THEME.upper())).encode()
    
    
    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path == "/theme":
                body, kind = (THEME + "\n").encode(), "text/plain"
            elif self.path in ("/", "/index.html"):
                body, kind = HTML, "text/html; charset=utf-8"
            elif self.path == "/healthz":
                body, kind = b"ok\n", "text/plain"
            else:
                self.send_error(404)
                return
            self.send_response(200)
            self.send_header("Content-Type", kind)
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)
    
        def log_message(self, fmt, *args):
            pass
    
    
    signal.signal(signal.SIGTERM, lambda *a: sys.exit(0))
    print("Campus Today is up on port %d (theme: %s)" % (PORT, THEME), flush=True)
    ThreadingHTTPServer(("", PORT), Handler).serve_forever()
