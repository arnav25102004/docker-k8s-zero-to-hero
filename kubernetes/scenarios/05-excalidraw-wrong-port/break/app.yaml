# K05 break: the Service forwards to port 8080, but Excalidraw listens on port 80.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: draw
  namespace: k-05-wrong-port
spec:
  replicas: 2
  selector:
    matchLabels:
      app: draw
  template:
    metadata:
      labels:
        app: draw
    spec:
      containers:
        - name: draw
          image: excalidraw/excalidraw:latest@sha256:f7ee194addd607bf831d2af0f0a34463dd4225e426cf35199ef0b12a803398e9
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
---
apiVersion: v1
kind: Service
metadata:
  name: draw
  namespace: k-05-wrong-port
spec:
  selector:
    app: draw
  ports:
    - port: 80
      targetPort: 8080    # the container listens on 80
