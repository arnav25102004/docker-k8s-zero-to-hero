# A small visitor that asks the app "are you ready?" every 2 seconds: the live signal on stage.
apiVersion: v1
kind: Pod
metadata:
  name: visitor
  namespace: k-12-dns-app
spec:
  containers:
    - name: visitor
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          while true; do
            if wget -q -T 2 -O /dev/null http://showdown/readyz 2>/dev/null; then
              echo "✅ $(date +%T) HTTP 200"
            else
              echo "❌ $(date +%T) http://showdown/readyz says: not ready"
            fi
            sleep 2
          done
