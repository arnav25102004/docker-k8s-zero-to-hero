<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" role="img" aria-labelledby="t d">
<title id="t">S2.1: The label on the wrong object</title><desc id="d">The label app=samosa is on the Deployment object, but Pods get their labels from the template, which lacks it. The Service selects nothing.</desc>
<defs><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d63ed"/></marker><marker id="ah-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#55637a"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="ah-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a85a00"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f1f3d"/></marker></defs>
<rect width="1000" height="440" fill="#ffffff"/>
<text x="500.0" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#0f1f3d" text-anchor="middle">The label on the wrong object</text><text x="500.0" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#55637a" text-anchor="middle">Labels belong to one object and do not flow downwards</text>
<rect x="40" y="100" width="235" height="130" rx="12" fill="#ffffff" stroke="#c4cfdf" stroke-width="2"/>
<text x="157.5" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f1f3d" text-anchor="middle">Deployment samosa</text>
<text x="157.5" y="170" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="500" fill="#0f1f3d" text-anchor="middle">label app=samosa</text>
<text x="157.5" y="192" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#55637a" text-anchor="middle">(on the Deployment)</text>
<rect x="382" y="100" width="235" height="130" rx="12" fill="#f4f7fb" stroke="#c4cfdf" stroke-width="2"/>
<text x="499.5" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f1f3d" text-anchor="middle">Pod template</text>
<text x="499.5" y="170" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="500" fill="#c62828" text-anchor="middle">no app=samosa</text>
<text x="499.5" y="192" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#55637a" text-anchor="middle">only stall=...</text>
<rect x="725" y="100" width="235" height="130" rx="12" fill="#fff4e0" stroke="#a85a00" stroke-width="2"/>
<text x="842.5" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f1f3d" text-anchor="middle">Service samosa</text>
<text x="842.5" y="170" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="500" fill="#0f1f3d" text-anchor="middle">selects app=samosa</text>
<text x="842.5" y="192" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#55637a" text-anchor="middle">finds nothing</text>
<line x1="278" y1="165" x2="379" y2="165" stroke="#c62828" stroke-width="3" stroke-dasharray="9 6" marker-end="url(#ah-red)"/>
<circle cx="328" cy="165" r="14" fill="#c62828"/><path d="M322,159 L334,171 M334,159 L322,171" stroke="#fff" stroke-width="3.4" stroke-linecap="round"/>
<line x1="620" y1="165" x2="722" y2="165" stroke="#c62828" stroke-width="3" stroke-dasharray="9 6" marker-end="url(#ah-red)"/>
<circle cx="671" cy="165" r="14" fill="#c62828"/><path d="M665,159 L677,171 M677,159 L665,171" stroke="#fff" stroke-width="3.4" stroke-linecap="round"/>
<text x="500" y="268" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#55637a" text-anchor="middle" font-style="italic">The label is right there in the YAML. It is just on the wrong object.</text>
<rect x="40" y="292" width="920" height="72" rx="12" fill="#fdecea" stroke="#c62828" stroke-width="2"/>
<text x="62" y="311" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#c62828" text-anchor="start">WHAT YOU SEE</text>
<text x="62" y="331" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#0f1f3d" text-anchor="start">Pods Running, Service with no endpoints. kubectl get pods --show-labels does not show the label the</text>
<text x="62" y="351" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#0f1f3d" text-anchor="start">Service wants.</text>
<rect x="40" y="372" width="920" height="52" rx="12" fill="#e7f6ec" stroke="#15803d" stroke-width="2"/>
<text x="62" y="391" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#15803d" text-anchor="start">THE FIX</text>
<text x="62" y="411" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#0f1f3d" text-anchor="start">Put app=samosa in the Pod template labels (spec.template.metadata.labels).</text>
</svg>
