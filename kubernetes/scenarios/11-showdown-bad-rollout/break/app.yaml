# K11 break, step 1: release v1 (the good one). 3 replicas, rolling updates that never remove a Ready Pod first.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: showdown
  namespace: k-11-bad-rollout
  annotations:
    kubernetes.io/change-cause: "v1 good release"
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: showdown
  template:
    metadata:
      labels:
        app: showdown
    spec:
      containers:
        - name: showdown
          image: python:3.12-alpine
          command: ["python", "/app/app.py"]
          env:
            - name: APP_VERSION
              value: "1.0.0"
            - name: PORT
              value: "8080"
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            periodSeconds: 2
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
          volumeMounts:
            - name: code
              mountPath: /app
              readOnly: true
      volumes:
        - name: code
          configMap:
            name: showdown-code
            items:
              - key: app.py
                path: app.py
              - key: index.html
                path: static/index.html
---
apiVersion: v1
kind: Service
metadata:
  name: showdown
  namespace: k-11-bad-rollout
spec:
  selector:
    app: showdown
  ports:
    - port: 80
      targetPort: 8080
