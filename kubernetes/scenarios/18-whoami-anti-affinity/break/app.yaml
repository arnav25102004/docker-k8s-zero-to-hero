# K18 break (1/2): whoami says which Pod answered. break.sh scales it up after this file is applied,
# so there is no "replicas:" here on purpose (a later kubectl apply must never reset the scale).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami
  namespace: k-18-anti-affinity
  labels: { app: whoami }
spec:
  selector:
    matchLabels: { app: whoami }
  template:
    metadata:
      labels: { app: whoami }
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels: { app: whoami }
              topologyKey: kubernetes.io/hostname
      containers:
        - name: whoami
          image: traefik/whoami:v1.10.4
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: whoami
  namespace: k-18-anti-affinity
spec:
  selector: { app: whoami }
  ports:
    - port: 80
      targetPort: 80
