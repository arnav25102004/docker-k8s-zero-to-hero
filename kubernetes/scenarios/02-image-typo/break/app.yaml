# K02: scenario manifest
apiVersion: apps/v1
kind: Deployment
metadata:
  name: draw
  namespace: k-02-image-typo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: draw
  template:
    metadata:
      labels:
        app: draw
    spec:
      containers:
        - name: draw
          image: excalidraw/excalidrw:latest@sha256:f7ee194addd607bf831d2af0f0a34463dd4225e426cf35199ef0b12a803398e9
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
---
apiVersion: v1
kind: Service
metadata:
  name: draw
  namespace: k-02-image-typo
spec:
  selector:
    app: draw
  ports:
    - port: 80
      targetPort: 80
