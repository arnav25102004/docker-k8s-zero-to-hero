# K19 break (4/4): a small visitor that asks for the dashboard every 2 seconds: the live
# signal on stage. It declares resources too: the quota applies to EVERY Pod in the
# namespace, so a Pod without them would be refused just like the dashboard's Pods.
apiVersion: v1
kind: Pod
metadata:
  name: visitor
  namespace: k-19-hackathon
spec:
  containers:
    - name: visitor
      image: busybox:1.36
      resources:
        requests:
          cpu: 10m
          memory: 8Mi
        limits:
          cpu: 50m
          memory: 16Mi
      command:
        - sh
        - -c
        - |
          while true; do
            if wget -q -T 2 -O /dev/null http://dashboard 2>/dev/null; then
              echo "✅ $(date +%T) HTTP 200"
            else
              echo "❌ $(date +%T) no answer from http://dashboard"
            fi
            sleep 2
          done
