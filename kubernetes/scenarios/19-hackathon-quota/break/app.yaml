# K19 break (3/4): the dashboard (Homer). The Pod template sets NO resources, and this
# namespace has a ResourceQuota, so the ReplicaSet is not allowed to create the Pods.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  namespace: k-19-hackathon
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dashboard
  template:
    metadata:
      labels:
        app: dashboard
    spec:
      containers:
        - name: homer
          image: b4bz/homer:v25.10.1
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
          volumeMounts:
            - name: config
              mountPath: /www/assets/config.yml
              subPath: config.yml
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: homer-config
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard
  namespace: k-19-hackathon
spec:
  selector:
    app: dashboard
  ports:
    - port: 80
      targetPort: 8080
