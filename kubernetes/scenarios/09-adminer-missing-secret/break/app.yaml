# K09: scenario manifest
apiVersion: apps/v1
kind: Deployment
metadata:
  name: adminer
  namespace: k-09-missing-secret
spec:
  replicas: 1
  selector:
    matchLabels:
      app: adminer
  template:
    metadata:
      labels:
        app: adminer
    spec:
      containers:
        - name: adminer
          image: adminer:5.4.1
          ports:
            - containerPort: 8080
          env:
            - name: ADMINER_DEFAULT_SERVER
              value: db
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: adminer-db
                  key: password
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: adminer
  namespace: k-09-missing-secret
spec:
  selector:
    app: adminer
  ports:
    - port: 80
      targetPort: 8080
