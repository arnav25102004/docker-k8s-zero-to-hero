# S6.x1 scenario manifest
apiVersion: v1
kind: LimitRange
metadata:
  name: stall-limits
  namespace: k-40-limit-max
spec:
  limits:
    - type: Container
      max:
        memory: 128Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chaat
  namespace: k-40-limit-max
spec:
  replicas: 2
  selector:
    matchLabels:
      app: chaat
  template:
    metadata:
      labels:
        app: chaat
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: stall
          image: hashicorp/http-echo:1.0.0
          args: ["-text=🥗 Fresh chaat, extra sev."]
          ports:
            - containerPort: 5678
          readinessProbe:
            httpGet:
              path: /
              port: 5678
            periodSeconds: 2
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {cpu: 100m, memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: chaat
  namespace: k-40-limit-max
spec:
  selector:
    app: chaat
  ports:
    - port: 80
      targetPort: 5678
