# S6.4 scenario manifest
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chai
  namespace: k-31-two-stalls
spec:
  replicas: 2
  selector:
    matchLabels:
      app: chai
      track: fresh
  template:
    metadata:
      labels:
        app: chai
        track: fresh
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: stall
          image: hashicorp/http-echo:1.0.0
          args: ["-text=☕ Fresh chai, extra ginger!"]
          ports:
            - containerPort: 5678
          readinessProbe:
            httpGet:
              path: /
              port: 5678
            periodSeconds: 2
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stale-chai
  namespace: k-31-two-stalls
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chai
      track: stale
  template:
    metadata:
      labels:
        app: chai
        track: stale
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: stall
          image: hashicorp/http-echo:1.0.0
          args: ["-text=🥶 Yesterday's chai. Cold. Sorry."]
          ports:
            - containerPort: 5678
          readinessProbe:
            httpGet:
              path: /
              port: 5678
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: chai
  namespace: k-31-two-stalls
spec:
  selector:
    app: chai
  ports:
    - port: 80
      targetPort: 5678
