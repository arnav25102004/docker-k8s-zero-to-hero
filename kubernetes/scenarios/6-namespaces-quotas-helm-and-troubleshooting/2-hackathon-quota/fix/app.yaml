# S6.2 fix: the same dashboard, now with requests and limits that fit inside the quota.
# Two replicas x (50m CPU, 32Mi) = 100m CPU, 64Mi in requests; the quota allows 500m / 256Mi.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  namespace: k-19-hackathon
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dashboard
  template:
    metadata:
      labels:
        app: dashboard
    spec:
      containers:
        - name: homer
          image: b4bz/homer:v25.10.1
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: 8080
          volumeMounts:
            - name: config
              mountPath: /www/assets/config.yml
              subPath: config.yml
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: homer-config
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard
  namespace: k-19-hackathon
spec:
  selector:
    app: dashboard
  ports:
    - port: 80
      targetPort: 8080
