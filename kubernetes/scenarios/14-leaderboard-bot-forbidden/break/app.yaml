# K14 break: the leaderboard bot has a ServiceAccount (an ID card) but no Role (no permissions).
apiVersion: v1
kind: ServiceAccount
metadata: { name: leaderboard-bot, namespace: k-14-forbidden }
---
# Two "players" so the leaderboard has something to count (plus the bot itself = 3 Pods).
apiVersion: apps/v1
kind: Deployment
metadata: { name: players, namespace: k-14-forbidden }
spec:
  replicas: 2
  selector: { matchLabels: { app: players } }
  template:
    metadata: { labels: { app: players } }
    spec:
      containers:
        - name: player
          image: busybox:1.36
          command: ["sleep", "86400"]
---
apiVersion: v1
kind: Pod
metadata: { name: bot, namespace: k-14-forbidden }
spec:
  serviceAccountName: leaderboard-bot
  containers:
    - name: bot
      image: curlimages/curl:8.11.1
      command: ["sh", "-c"]
      args:
        - |
          SA=/var/run/secrets/kubernetes.io/serviceaccount
          URL=https://kubernetes.default.svc/api/v1/namespaces/k-14-forbidden/pods
          while true; do
            CODE=$(curl -s -o /tmp/out -w '%{http_code}' --cacert $SA/ca.crt \
              -H "Authorization: Bearer $(cat $SA/token)" $URL)
            if [ "$CODE" = "200" ]; then
              echo "✅ found $(grep -c '"phase"' /tmp/out) players (pods)"
            else
              MSG=$(grep '"message"' /tmp/out | sed 's/^ *"message": *"//; s/",*$//; s/\\"/"/g')
              echo "❌ $CODE Forbidden: $MSG"
            fi
            sleep 5
          done
