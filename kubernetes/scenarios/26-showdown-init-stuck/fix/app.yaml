# K26 fix: the same Deployment, corrected.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: showdown
  namespace: k-26-init-stuck
spec:
  replicas: 1
  selector:
    matchLabels:
      app: showdown
  template:
    metadata:
      labels:
        app: showdown
    spec:
      terminationGracePeriodSeconds: 2
      initContainers:
        - name: wait-for-redis
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nslookup redis | grep -q '^Name:'; do echo waiting for redis; sleep 2; done
      containers:
        - name: showdown
          image: python:3.12-alpine
          command: ["python", "/app/app.py"]
          env:
            - name: REDIS_HOST
              value: "redis"
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
          volumeMounts:
            - name: code
              mountPath: /app
              readOnly: true
      volumes:
        - name: code
          configMap:
            name: showdown-code
            items:
              - key: app.py
                path: app.py
              - key: index.html
                path: static/index.html
---
apiVersion: v1
kind: Service
metadata:
  name: showdown
  namespace: k-26-init-stuck
spec:
  selector:
    app: showdown
  ports:
    - port: 80
      targetPort: 8080
