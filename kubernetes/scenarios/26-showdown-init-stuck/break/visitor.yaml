# A small visitor that asks the app if it is ready every 2 seconds: the live signal on stage.
apiVersion: v1
kind: Pod
metadata:
  name: visitor
  namespace: k-26-init-stuck
spec:
  terminationGracePeriodSeconds: 2
  containers:
    - name: visitor
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          while true; do
            if wget -q -T 2 -O /dev/null http://showdown/readyz 2>/dev/null; then
              echo "✅ $(date +%T) HTTP 200"
            else
              echo "❌ $(date +%T) no answer from http://showdown/readyz"
            fi
            sleep 2
          done
