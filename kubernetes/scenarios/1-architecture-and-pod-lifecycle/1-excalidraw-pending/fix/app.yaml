# S1.1: scenario manifest
apiVersion: apps/v1
kind: Deployment
metadata:
  name: draw
  namespace: k-01-pending
spec:
  replicas: 1
  selector:
    matchLabels:
      app: draw
  template:
    metadata:
      labels:
        app: draw
    spec:
      containers:
        - name: draw
          image: excalidraw/excalidraw:latest@sha256:f7ee194addd607bf831d2af0f0a34463dd4225e426cf35199ef0b12a803398e9
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
          resources:
            requests:
              memory: 64Mi    # a small, honest reservation
              cpu: 50m
            limits:
              memory: 128Mi   # a cap: the Pod is stopped if it goes beyond this
---
apiVersion: v1
kind: Service
metadata:
  name: draw
  namespace: k-01-pending
spec:
  selector:
    app: draw
  ports:
    - port: 80
      targetPort: 80
