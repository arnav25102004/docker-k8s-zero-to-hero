# A small visitor that asks for the whiteboard every 2 seconds: the live signal on stage.
apiVersion: v1
kind: Pod
metadata:
  name: visitor
  namespace: k-01-pending
spec:
  containers:
    - name: visitor
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          while true; do
            if wget -q -T 2 -O /dev/null http://draw 2>/dev/null; then
              echo "✅ $(date +%T) HTTP 200"
            else
              echo "❌ $(date +%T) no answer from http://draw"
            fi
            sleep 2
          done
