# K22 break (2/3): the Campus notice board, still on the unprivileged nginx image.
# The security team's next step has been added to this Deployment.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: board
  namespace: k-22-readonly-fs
spec:
  replicas: 2
  selector:
    matchLabels:
      app: board
  template:
    metadata:
      labels:
        app: board
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: board
          image: nginxinc/nginx-unprivileged:1.27.5-alpine
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
          securityContext:
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: page
              mountPath: /usr/share/nginx/html
      volumes:
        - name: page
          configMap:
            name: notice-board-page
---
apiVersion: v1
kind: Service
metadata:
  name: board
  namespace: k-22-readonly-fs
spec:
  selector:
    app: board
  ports:
    - port: 80
      targetPort: 8080
