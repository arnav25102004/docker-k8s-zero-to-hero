# K22 break (1/3): the Exam Week Board page, as a ConfigMap that nginx serves. Nothing is wrong here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: notice-board-page
  namespace: k-22-readonly-fs
data:
  index.html: |
    <!doctype html>
    <html lang="en">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Exam Week Board</title>
    <style>
      :root { --cork:#7fa3c7; --paper:#fdfdf3; --ink:#1d2b3a; --pin:#e0a020; }
      * { box-sizing: border-box; }
      body { margin:0; padding:20px; background:var(--cork); color:var(--ink); font:20px/1.4 system-ui,sans-serif; }
      h1 { text-align:center; margin:0 0 4px; font-size:38px; }
      .sub { text-align:center; margin:0 0 16px; font-size:18px; }
      nav { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-bottom:18px; }
      nav button { font:inherit; padding:6px 14px; border:2px solid var(--ink); border-radius:20px; background:var(--paper); cursor:pointer; }
      nav button.on { background:var(--ink); color:var(--paper); }
      #grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:20px; max-width:1000px; margin:0 auto; }
      .note { position:relative; background:var(--paper); padding:22px 16px 14px; border-radius:4px;
              box-shadow:3px 4px 8px rgba(0,0,0,.35); transform:rotate(var(--tilt)); }
      .note::before { content:""; position:absolute; top:6px; left:50%; width:14px; height:14px; margin-left:-7px;
                      border-radius:50%; background:var(--pin); box-shadow:1px 2px 2px rgba(0,0,0,.4); }
      .note h2 { margin:0 0 6px; font-size:22px; }
      .note p, .note ul { margin:4px 0; font-size:18px; }
      .note ul { padding-left:20px; }
      .tag { font-size:14px; text-transform:uppercase; letter-spacing:1px; opacity:.7; }
      .note button { font:inherit; font-size:16px; margin-top:6px; padding:3px 10px; border:2px solid var(--ink); border-radius:8px; background:#fff; cursor:pointer; }
      .note.found { background:#d8f3d0; }
      .note.hide { display:none; }
      footer { text-align:center; margin-top:22px; font-size:16px; }
    </style>
    </head>
    <body>
    <h1>📅 Exam Week Board</h1>
    <p class="sub">Halls, timetables and help for the week ahead. All names and events are made up.</p>
    <nav id="tabs"></nav>
    <div id="grid"></div>
    <footer>Served from a ConfigMap. No internet needed. <span id="clock"></span></footer>
    <script>
    var notices = [
      { cat:'exams', tilt:-1.4, title:'📝 Exam timetable', body:'<ul><li>Mon: Data Structures, 10 am</li><li>Wed: Maths II, 2 pm</li><li>Fri: Networks, 10 am</li></ul><p>Reach the hall 20 minutes early.</p>' },
      { cat:'exams', tilt:1.3, title:'🪪 Bring your ID card', body:'<p>No ID card, no hall ticket check. The front desk has a few temporary ones, and a very long queue.</p>' },
      { cat:'rooms', tilt:-0.9, title:'🏛️ Hall allocation', body:'<ul><li>Roll numbers 1 to 60: Hall A</li><li>Roll numbers 61 to 120: Hall B</li><li>Backlog papers: Seminar room</li></ul>' },
      { cat:'rooms', tilt:1.6, title:'🔌 Night study room', body:'<p>Room 12 stays open till midnight in exam week. Sockets are first come, first served.</p>' },
      { cat:'help', tilt:-1.2, title:'🙋 Doubt-clearing sessions', body:'<ul><li>Tue 5 pm: Maths II with Prof. Rao</li><li>Thu 5 pm: Networks with Prof. Iyer</li></ul><p>Bring your questions, not your phone.</p>' },
      { cat:'help', tilt:0.8, title:'🧠 Calm corner', body:'<p>Free tea, a quiet sofa and a sign that says "you will be fine". Counsellor drop-in from 3 to 5 pm.</p>' },
      { cat:'swap', tilt:-1.0, title:'📚 Book swap', body:'<p>Last year\'s notes for sale or swap. Leave a note under this one. Highlighters are not included.</p>' },
      { cat:'swap', tilt:1.4, title:'🔢 Found: a scientific calculator', body:'<p>Silver, with a sticker of a sleepy cat. Collect from the library desk.</p>', found:true }
    ];
    var cats = [['all','All'],['exams','Exams'],['rooms','Rooms'],['help','Help'],['swap','Swap']];
    var cur = 'all';
    function render() {
      var tabs = document.getElementById('tabs'); tabs.innerHTML = '';
      cats.forEach(function (c) {
        var b = document.createElement('button'); b.textContent = c[1];
        if (c[0] === cur) b.className = 'on';
        b.onclick = function () { cur = c[0]; render(); };
        tabs.appendChild(b);
      });
      var grid = document.getElementById('grid'); grid.innerHTML = '';
      notices.forEach(function (n) {
        if (cur !== 'all' && n.cat !== cur) return;
        var d = document.createElement('div'); d.className = 'note'; d.style.setProperty('--tilt', n.tilt + 'deg');
        d.innerHTML = '<div class="tag">' + n.cat + '</div><h2>' + n.title + '</h2>' + n.body;
        if (n.found) {
          var b = document.createElement('button'); b.textContent = 'This is mine!';
          b.onclick = function () { d.className = 'note found'; b.textContent = 'Great, see the library desk 🎉'; b.disabled = true; };
          d.appendChild(b);
        }
        grid.appendChild(d);
      });
    }
    function tick() { document.getElementById('clock').textContent = new Date().toLocaleTimeString(); }
    render(); tick(); setInterval(tick, 1000);
    </script>
    </body>
    </html>
