# K22 fix: the same notice board and the same policy, plus a scratch folder for the one place nginx writes.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: board
  namespace: k-22-readonly-fs
spec:
  replicas: 2
  selector:
    matchLabels:
      app: board
  template:
    metadata:
      labels:
        app: board
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: board
          image: nginxinc/nginx-unprivileged:1.27.5-alpine
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
          securityContext:
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: page
              mountPath: /usr/share/nginx/html
            # nginx keeps its pid file and temp folders in /tmp: give it a writable scratch folder there.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: page
          configMap:
            name: notice-board-page
        # Scratch space that lives as long as the Pod.
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: board
  namespace: k-22-readonly-fs
spec:
  selector:
    app: board
  ports:
    - port: 80
      targetPort: 8080
