# K46 scenario manifest
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
  namespace: k-46-3am
  labels: { app: orders }
spec:
  replicas: 1
  selector:
    matchLabels: { app: orders }
  template:
    metadata:
      labels: { app: orders }
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: orders
          image: busybox:1.36
          env:
            - name: DB_HOST
              value: "orders-db"
          command:
            - sh
            - -c
            - |
              echo "orders: connecting to database at $DB_HOST"
              if [ "$DB_HOST" != "orders-db" ]; then
                echo "orders: no database called $DB_HOST, giving up"
                exit 1
              fi
              echo "orders: connected, taking orders"
              mkdir -p /www && echo "order accepted" > /www/index.html
              exec httpd -f -p 8080 -h /www
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: { path: /, port: 8080 }
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: orders
  namespace: k-46-3am
spec:
  selector:
    app: orders
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: orders-alerts
  namespace: k-46-3am
spec:
  groups:
    - name: orders-alerts
      rules:
        - alert: OrdersRestartingTooOften
          expr: >-
            increase(kube_pod_container_status_restarts_total{namespace="k-46-3am",container="orders"}[5m]) > 1
          labels:
            severity: page
          annotations:
            summary: The orders service restarted more than once in 5 minutes
