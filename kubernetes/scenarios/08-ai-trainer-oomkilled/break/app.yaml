# K08: scenario manifest
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trainer
  namespace: k-08-oomkilled
  labels: { app: trainer }
spec:
  replicas: 1
  selector:
    matchLabels: { app: trainer }
  template:
    metadata:
      labels: { app: trainer }
    spec:
      containers:
        - name: trainer
          image: python:3.12-alpine
          command: ["python", "-u", "-c"]
          args:
            - |
              import time
              data = []
              for epoch in range(1, 7):
                  print(f"epoch {epoch}/6 ... loading 25 MB", flush=True)
                  data.append(bytearray(b"x") * (25 * 1024 * 1024))
                  time.sleep(1)
              print("✅ model trained", flush=True)
              # Finished: stay Running instead of exiting, so Kubernetes doesn't restart a job that is done.
              while True:
                  time.sleep(3600)
          resources:
            requests: { memory: 64Mi }
            limits: { memory: 64Mi }
