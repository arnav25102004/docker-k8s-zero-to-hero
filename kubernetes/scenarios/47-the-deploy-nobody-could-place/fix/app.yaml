# K47 scenario manifest
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
  namespace: k-47-capacity
  labels: { app: checkout }
spec:
  replicas: 2
  selector:
    matchLabels: { app: checkout }
  template:
    metadata:
      labels: { app: checkout }
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: checkout
          image: hashicorp/http-echo:1.0.0
          args: ["-text=🛒 Checkout is open."]
          ports:
            - containerPort: 5678
          readinessProbe:
            httpGet: { path: /, port: 5678 }
            periodSeconds: 2
          resources:
            requests: { cpu: 20m, memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: checkout
  namespace: k-47-capacity
spec:
  selector:
    app: checkout
  ports:
    - port: 80
      targetPort: 5678
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: checkout-alerts
  namespace: k-47-capacity
spec:
  groups:
    - name: checkout-alerts
      rules:
        - alert: CheckoutPodsPending
          expr: >-
            sum(kube_pod_status_phase{namespace="k-47-capacity",phase="Pending"}) > 0
          labels:
            severity: page
          annotations:
            summary: Checkout Pods are waiting for a node
