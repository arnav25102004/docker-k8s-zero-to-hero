# A small visitor that asks the checkout every 2 seconds: the live signal on stage.
apiVersion: v1
kind: Pod
metadata:
  name: visitor
  namespace: k-47-capacity
spec:
  terminationGracePeriodSeconds: 1
  containers:
    - name: visitor
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          while true; do
            r=$(wget -q -T 2 -O - http://checkout 2>/dev/null)
            if [ -n "$r" ]; then
              echo "✅ $(date +%T) the checkout answers"
            else
              echo "❌ $(date +%T) checkout is down"
            fi
            sleep 2
          done
