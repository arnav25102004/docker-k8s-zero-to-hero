# K15: a real Redis behind a Service named "redis". The Service is what makes Kubernetes
# inject REDIS_PORT=tcp://<ClusterIP>:6379 into every Pod that starts AFTER it exists.
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: k-15-mystery-env
spec:
  selector:
    app: redis
  ports:
    - port: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: k-15-mystery-env
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7.4.12-alpine
          ports:
            - containerPort: 6379
          readinessProbe:
            tcpSocket:
              port: 6379
            periodSeconds: 2
