# K15 fix: same worker, but Kubernetes is told NOT to inject Docker-link-style variables.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: score-worker
  namespace: k-15-mystery-env
spec:
  replicas: 1
  selector:
    matchLabels:
      app: score-worker
  template:
    metadata:
      labels:
        app: score-worker
    spec:
      enableServiceLinks: false      # no more REDIS_PORT=tcp://... from the "redis" Service
      containers:
        - name: worker
          image: python:3.12-alpine
          command: ["python", "-c"]
          args:
            - |
              import os, socket, time
              port = int(os.environ.get("REDIS_PORT", "6379"))
              while True:
                  try:
                      with socket.create_connection(("redis", port), timeout=2) as s:
                          s.sendall(b"PING\r\n")
                          if s.recv(16).startswith(b"+PONG"):
                              break
                  except OSError:
                      pass
                  time.sleep(1)
              print(f"worker connected to redis:{port}", flush=True)
              open("/tmp/ready", "w").close()
              time.sleep(3600)
          readinessProbe:
            exec:
              command: ["cat", "/tmp/ready"]
            periodSeconds: 2
