# K06 break: the readiness probe checks /healthz.php, a path Kanboard doesn't have (404).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: board
  namespace: k-06-never-ready
spec:
  replicas: 1
  selector:
    matchLabels:
      app: board
  template:
    metadata:
      labels:
        app: board
    spec:
      containers:
        - name: board
          image: kanboard/kanboard:v1.2.57
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /healthz.php    # Kanboard has no such file
              port: 80
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: board
  namespace: k-06-never-ready
spec:
  selector:
    app: board
  ports:
    - port: 80
      targetPort: 80
