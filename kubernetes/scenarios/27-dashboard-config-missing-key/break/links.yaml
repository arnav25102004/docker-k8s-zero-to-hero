# K27 break (1/3): the "Campus quick links" page for Homer, written for this course.
apiVersion: v1
kind: ConfigMap
metadata:
  name: homer-config
  namespace: k-27-config-key
data:
  config.yaml: |
    title: "Campus quick links"
    subtitle: "Bengaluru campus · everything a student needs before the 9 AM bell"
    header: true
    footer: '<p>Made with chai by the Student Council. Last bus leaves the main gate at 8:30 PM.</p>'
    columns: "3"
    connectivityCheck: false
    theme: default
    colors:
      light:
        highlight-primary: "#0f766e"
        highlight-secondary: "#14b8a6"
        highlight-hover: "#2dd4bf"
        background: "#f0fdfa"
        card-background: "#ffffff"
        text: "#134e4a"
        text-header: "#ffffff"
        text-title: "#115e59"
        text-subtitle: "#334155"
        card-shadow: rgba(0, 0, 0, 0.1)
        link: "#0f766e"
        link-hover: "#be123c"
      dark:
        highlight-primary: "#0f766e"
        highlight-secondary: "#14b8a6"
        highlight-hover: "#2dd4bf"
        background: "#0b1f1e"
        card-background: "#12312f"
        text: "#e6fffb"
        text-header: "#ffffff"
        text-title: "#ccfbf1"
        text-subtitle: "#99f6e4"
        card-shadow: rgba(0, 0, 0, 0.4)
        link: "#5eead4"
        link-hover: "#fda4af"
    services:
      - name: "Food and chai"
        icon: "fas fa-utensils"
        items:
          - name: "Canteen menu"
            subtitle: "Lemon rice today. Curd rice if you are early"
            tag: "Lunch"
            url: "#"
          - name: "Chai o'clock"
            subtitle: "4:15 PM at the lawn stall. Bring your own steel tumbler"
            tag: "Daily"
            url: "#"
      - name: "Study"
        icon: "fas fa-book"
        items:
          - name: "Library hours"
            subtitle: "Open till 10 PM in exam week. Silence is enforced by glares"
            url: "#"
          - name: "Lab bookings"
            subtitle: "Block 3, second floor. The good keyboards go first"
            tag: "Block 3"
            url: "#"
          - name: "Lost and found"
            subtitle: "Three umbrellas, one calculator, a very sad lunch box"
            url: "#"
      - name: "Getting around"
        icon: "fas fa-bus"
        items:
          - name: "Last bus"
            subtitle: "8:30 PM from the main gate. It does not wait for you"
            tag: "8:30 PM"
            url: "#"
          - name: "Cycle stand"
            subtitle: "Row C is free. Row A belongs to the hostel seniors"
            url: "#"
