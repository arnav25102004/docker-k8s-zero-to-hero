# K36 scenario manifest
apiVersion: apps/v1
kind: Deployment
metadata:
  name: thali
  namespace: k-36-two-probes
spec:
  replicas: 2
  selector:
    matchLabels:
      app: thali
  template:
    metadata:
      labels:
        app: thali
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: counter
          image: busybox:1.36
          command:
            - sh
            - -c
            - 'mkdir -p /www; echo "🍽️ Thali is ready. Both of you may sit." > /www/index.html; exec httpd -f -p 8080 -h /www'
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 3
            timeoutSeconds: 1
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: thali
  namespace: k-36-two-probes
spec:
  selector:
    app: thali
  ports:
    - port: 80
      targetPort: 8080
