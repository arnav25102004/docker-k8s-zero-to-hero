# S5.3 fix: the same Deployment, now with a CPU request (what the autoscaler measures against) and a CPU limit.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: showdown
  namespace: k-25-hpa
spec:
  replicas: 1
  selector:
    matchLabels:
      app: showdown
  template:
    metadata:
      labels:
        app: showdown
    spec:
      containers:
        - name: showdown
          image: python:3.12-alpine
          command: ["python", "/app/app.py"]
          env:
            - name: PORT
              value: "8080"
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
            limits:
              cpu: 200m
          volumeMounts:
            - name: code
              mountPath: /app
              readOnly: true
      volumes:
        - name: code
          configMap:
            name: showdown-code
            items:
              - key: app.py
                path: app.py
              - key: index.html
                path: static/index.html
---
apiVersion: v1
kind: Service
metadata:
  name: showdown
  namespace: k-25-hpa
spec:
  selector:
    app: showdown
  ports:
    - port: 80
      targetPort: 8080
