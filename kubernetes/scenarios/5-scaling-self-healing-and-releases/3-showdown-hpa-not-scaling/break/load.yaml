# The "traffic": two loops in one small Pod, each asking the app to work hard for 2 seconds,
# again and again (the app's own /api/burn endpoint keeps one CPU busy while it answers).
apiVersion: v1
kind: Pod
metadata:
  name: load
  namespace: k-25-hpa
spec:
  # sh as PID 1 ignores SIGTERM; a short grace keeps cleanup fast
  terminationGracePeriodSeconds: 1
  containers:
    - name: load
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          while true; do wget -q -T 10 -O /dev/null "http://showdown/api/burn?seconds=2" 2>/dev/null; sleep 0.2; done &
          while true; do wget -q -T 10 -O /dev/null "http://showdown/api/burn?seconds=2" 2>/dev/null; sleep 0.2; done
