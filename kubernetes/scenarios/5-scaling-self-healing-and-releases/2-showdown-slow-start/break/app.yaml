# S5.2: scenario manifest
apiVersion: apps/v1
kind: Deployment
metadata:
  name: showdown
  namespace: k-07-slow-start
spec:
  replicas: 1
  selector:
    matchLabels:
      app: showdown
  template:
    metadata:
      labels:
        app: showdown
    spec:
      containers:
        - name: showdown
          image: python:3.12-alpine
          command: ["python", "/app/app.py"]
          env:
            - name: STARTUP_DELAY
              value: "20"       # seconds of "warming up" before the app listens
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 1
          volumeMounts:
            - name: code
              mountPath: /app
              readOnly: true
      volumes:
        - name: code
          configMap:
            name: showdown-code
            items:
              - key: app.py
                path: app.py
              - key: index.html
                path: static/index.html
---
apiVersion: v1
kind: Service
metadata:
  name: showdown
  namespace: k-07-slow-start
spec:
  selector:
    app: showdown
  ports:
    - port: 80
      targetPort: 8080
