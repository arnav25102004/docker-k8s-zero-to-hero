# A small visitor that asks the biryani counter every 2 seconds: the live signal on stage.
apiVersion: v1
kind: Pod
metadata:
  name: visitor
  namespace: k-35-slow-biryani
spec:
  terminationGracePeriodSeconds: 1
  containers:
    - name: visitor
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          while true; do
            r=$(wget -q -T 2 -O - http://biryani 2>/dev/null)
            if [ -n "$r" ]; then
              echo "✅ $(date +%T) $r"
            else
              echo "❌ $(date +%T) the biryani is not ready"
            fi
            sleep 2
          done
