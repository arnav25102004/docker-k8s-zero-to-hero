# S5.x1 scenario manifest
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dosa
  namespace: k-34-doorbell
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dosa
  template:
    metadata:
      labels:
        app: dosa
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: counter
          image: hashicorp/http-echo:1.0.0
          args: ["-text=🥞 Crispy masala dosa, coming up!"]
          ports:
            - containerPort: 5678
          readinessProbe:
            httpGet:
              path: /
              port: 5678
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: dosa
  namespace: k-34-doorbell
spec:
  selector:
    app: dosa
  ports:
    - port: 80
      targetPort: 5678
