# S4.5 fix: the same notice board and the same policy, but on an image built to run as a normal user.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: board
  namespace: k-21-nonroot
spec:
  replicas: 2
  selector:
    matchLabels:
      app: board
  template:
    metadata:
      labels:
        app: board
    spec:
      # Unchanged: the policy stays.
      securityContext:
        runAsNonRoot: true
      containers:
        - name: board
          # nginx-unprivileged runs as user 101 and listens on 8080 instead of 80.
          image: nginxinc/nginx-unprivileged:1.27.5-alpine
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
          volumeMounts:
            - name: page
              mountPath: /usr/share/nginx/html
      volumes:
        - name: page
          configMap:
            name: notice-board-page
---
apiVersion: v1
kind: Service
metadata:
  name: board
  namespace: k-21-nonroot
spec:
  selector:
    app: board
  ports:
    - port: 80
      targetPort: 8080
