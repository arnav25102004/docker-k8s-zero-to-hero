# S4.5 break (2/3): the Campus notice board, served by plain nginx.
# The security team rolled out a new policy yesterday; this Deployment was updated to follow it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: board
  namespace: k-21-nonroot
spec:
  replicas: 2
  selector:
    matchLabels:
      app: board
  template:
    metadata:
      labels:
        app: board
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: board
          image: nginx:1.27.5-alpine
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
          volumeMounts:
            - name: page
              mountPath: /usr/share/nginx/html
      volumes:
        - name: page
          configMap:
            name: notice-board-page
---
apiVersion: v1
kind: Service
metadata:
  name: board
  namespace: k-21-nonroot
spec:
  selector:
    app: board
  ports:
    - port: 80
      targetPort: 80
