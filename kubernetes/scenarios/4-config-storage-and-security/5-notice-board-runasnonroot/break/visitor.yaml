# S4.5 break (3/3): a small visitor that asks for the notice board every 2 seconds: the live signal on stage.
apiVersion: v1
kind: Pod
metadata:
  name: visitor
  namespace: k-21-nonroot
spec:
  containers:
    - name: visitor
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          while true; do
            if wget -q -T 2 -O /dev/null http://board 2>/dev/null; then
              echo "✅ $(date +%T) HTTP 200"
            else
              echo "❌ $(date +%T) no answer from http://board"
            fi
            sleep 2
          done
