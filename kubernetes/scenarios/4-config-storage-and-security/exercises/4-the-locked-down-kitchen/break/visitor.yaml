# A small visitor that asks the locked-down kitchen every 2 seconds: the live signal on stage.
apiVersion: v1
kind: Pod
metadata:
  name: visitor
  namespace: k-45-lockdown
spec:
  terminationGracePeriodSeconds: 1
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: visitor
      image: busybox:1.36
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      command:
        - sh
        - -c
        - |
          while true; do
            r=$(wget -q -T 2 -O /dev/null http://kitchen && echo "the kitchen answers" 2>/dev/null)
            if [ -n "$r" ]; then
              echo "✅ $(date +%T) $r"
            else
              echo "❌ $(date +%T) the kitchen is closed"
            fi
            sleep 2
          done
