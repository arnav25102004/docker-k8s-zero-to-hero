# K35 scenario manifest
apiVersion: apps/v1
kind: Deployment
metadata:
  name: biryani
  namespace: k-35-slow-biryani
spec:
  replicas: 2
  selector:
    matchLabels:
      app: biryani
  template:
    metadata:
      labels:
        app: biryani
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: counter
          image: busybox:1.36
          command:
            - sh
            - -c
            - 'mkdir -p /www; echo "🍛 Biryani, worth the wait." > /www/index.html; sleep 20; exec httpd -f -p 8080 -h /www'
          ports:
            - containerPort: 8080
          startupProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 3
            timeoutSeconds: 1
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: biryani
  namespace: k-35-slow-biryani
spec:
  selector:
    app: biryani
  ports:
    - port: 80
      targetPort: 8080
