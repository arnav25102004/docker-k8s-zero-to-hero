# K38 scenario manifest
apiVersion: apps/v1
kind: Deployment
metadata:
  name: night-canteen
  namespace: k-38-night-canteen
spec:
  replicas: 2
  selector:
    matchLabels:
      app: night-canteen
  template:
    metadata:
      labels:
        app: night-canteen
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: stall
          image: hashicorp/http-echo:1.0.0
          args: ["-text=🌙 Night canteen: maggi and chai, open till 2 AM."]
          ports:
            - containerPort: 5678
          readinessProbe:
            httpGet:
              path: /
              port: 5678
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: night-canteen
  namespace: k-38-night-canteen
spec:
  selector:
    app: night-canteen
  ports:
    - port: 80
      targetPort: 5678
