# S2.4: the reset script, kept in a ConfigMap. Python's standard library has no Redis client,
# so it speaks Redis's plain-text protocol (RESP) over a raw socket in a few lines.
apiVersion: v1
kind: ConfigMap
metadata:
  name: reset-script
  namespace: k-28-job
data:
  reset.py: |
    import os
    import socket

    host = os.environ["REDIS_HOST"]
    print(f"resetting the leaderboard on {host}:6379", flush=True)

    def command(sock, *args):
        # RESP: an array of bulk strings, e.g. *2\r\n$3\r\nDEL\r\n$6\r\nscores\r\n
        out = b"*%d\r\n" % len(args)
        for a in args:
            b = str(a).encode()
            out += b"$%d\r\n%s\r\n" % (len(b), b)
        sock.sendall(out)
        reply = sock.recv(64).decode().strip()
        if reply.startswith("-"):  # RESP errors start with "-"
            raise SystemExit(f"redis said: {reply}")
        return reply

    with socket.create_connection((host, 6379), timeout=5) as s:
        command(s, "DEL", "scores")
        command(s, "ZADD", "scores", 0, "Lakshmi", 0, "Ravi", 0, "Meera", 0, "Priya", 0, "Arjun")
    print("✅ leaderboard reset", flush=True)
