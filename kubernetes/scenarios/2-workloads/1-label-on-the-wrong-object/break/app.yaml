# S2.1 scenario manifest
apiVersion: apps/v1
kind: Deployment
metadata:
  name: samosa
  namespace: k-32-wrong-object
  labels:
    app: samosa
spec:
  replicas: 2
  selector:
    matchLabels:
      stall: samosa-fryer
  template:
    metadata:
      labels:
        stall: samosa-fryer
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: stall
          image: hashicorp/http-echo:1.0.0
          args: ["-text=🥟 Hot samosas! Mint chutney included."]
          ports:
            - containerPort: 5678
          readinessProbe:
            httpGet:
              path: /
              port: 5678
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: samosa
  namespace: k-32-wrong-object
spec:
  selector:
    app: samosa
  ports:
    - port: 80
      targetPort: 5678
