# Headless Service: gives each StatefulSet Pod its own stable DNS name:
#   redis-0.redis-headless.default.svc.cluster.local
apiVersion: v1
kind: Service
metadata:
  name: redis-headless
spec:
  clusterIP: None
  selector: { app: redis-sts }
  ports:
    - port: 6379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
spec:
  serviceName: redis-headless
  replicas: 2
  selector:
    matchLabels: { app: redis-sts }
  template:
    metadata:
      labels: { app: redis-sts }
    spec:
      containers:
        - name: redis
          image: redis:7.4.12-alpine
          args: ["--appendonly", "yes"]
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
  # Each replica gets its OWN PersistentVolumeClaim: data-redis-0, data-redis-1
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 100Mi
