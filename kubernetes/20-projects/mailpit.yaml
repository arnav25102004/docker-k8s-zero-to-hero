# Lab K20: a mail catcher. Every email Jenkins or Prometheus sends lands here instead of the internet.
# Web inbox on port 8025, SMTP on 1025. Nothing leaves your laptop.
apiVersion: v1
kind: Namespace
metadata:
  name: mail
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
  namespace: mail
  labels: { app: mailpit }
spec:
  replicas: 1
  selector:
    matchLabels: { app: mailpit }
  template:
    metadata:
      labels: { app: mailpit }
    spec:
      containers:
        - name: mailpit
          image: axllent/mailpit:v1.33.0
          ports:
            - name: smtp
              containerPort: 1025
            - name: web
              containerPort: 8025
          readinessProbe:
            tcpSocket: { port: web }
            periodSeconds: 5
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: mailpit
  namespace: mail
spec:
  selector: { app: mailpit }
  ports:
    - name: smtp
      port: 1025
      targetPort: smtp
    - name: web
      port: 8025
      targetPort: web
