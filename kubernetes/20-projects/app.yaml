# Lab K20: the Showdown app in its own namespace "showdown" (Jenkins deploys this).
# The namespace itself comes from rbac.yaml, because the deployer may only touch what is inside it.
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: showdown
  name: redis
  labels: { app: redis }
spec:
  replicas: 1
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis }
    spec:
      enableServiceLinks: false
      containers:
        - name: redis
          image: redis:7.4.12-alpine
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  namespace: showdown
  name: redis
spec:
  selector: { app: redis }
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: showdown
  name: api
  labels: { app: api }
spec:
  replicas: 3
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      containers:
        - name: api
          image: z2h/api:1.0
          imagePullPolicy: IfNotPresent
          env:
            - name: REDIS_HOST
              value: redis              # a Service name: resolved by cluster DNS
          ports:
            - name: http                # named port: Services can target it by name
              containerPort: 8080
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 3
          resources:
            requests: { cpu: 25m, memory: 48Mi }
            limits: { memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  namespace: showdown
  name: api
spec:
  type: ClusterIP                       # default: reachable only inside the cluster
  selector:
    app: api                            # send traffic to Pods with this label
  ports:
    - name: http
      port: 8080                        # the port clients use:  http://api:8080
      targetPort: http                  # the container port (by name)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: showdown
  name: frontend
  labels: { app: frontend }
spec:
  replicas: 1
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      containers:
        - name: nginx
          image: z2h/frontend:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: { path: /nginx-health, port: 8080 }
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  namespace: showdown
  name: frontend
spec:
  selector: { app: frontend }
  ports:
    - port: 80
      targetPort: 8080
