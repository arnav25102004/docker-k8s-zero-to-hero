<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" role="img" aria-labelledby="t d">
<title id="t">Lab K16: Pod security</title><desc id="d">A Pod asks for risky settings, the namespace guard refuses them, and a hardened Pod passes.</desc>
<defs><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d63ed"/></marker><marker id="ah-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#55637a"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="ah-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a85a00"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f1f3d"/></marker></defs>
<rect width="1000" height="420" fill="#ffffff"/>
<text x="500.0" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#0f1f3d" text-anchor="middle">K16 · Pod security</text><text x="500.0" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#55637a" text-anchor="middle">The cluster can say no to unsafe Pods</text>
<rect x="40" y="100" width="235" height="130" rx="12" fill="#fdecea" stroke="#c62828" stroke-width="2"/>
<text x="157.5" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f1f3d" text-anchor="middle">Pod asks for</text>
<text x="157.5" y="170" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="500" fill="#0f1f3d" text-anchor="middle">privileged: true</text>
<text x="157.5" y="192" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#55637a" text-anchor="middle">or to run as root</text>
<rect x="382" y="100" width="235" height="130" rx="12" fill="#fff4e0" stroke="#a85a00" stroke-width="2"/>
<text x="499.5" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f1f3d" text-anchor="middle">Namespace guard</text>
<text x="499.5" y="170" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="500" fill="#0f1f3d" text-anchor="middle">enforce: restricted</text>
<text x="499.5" y="192" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#55637a" text-anchor="middle">checked on creation</text>
<rect x="725" y="100" width="235" height="130" rx="12" fill="#e7f6ec" stroke="#15803d" stroke-width="2"/>
<text x="842.5" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f1f3d" text-anchor="middle">Safe Pod</text>
<text x="842.5" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#55637a" text-anchor="middle">non-root, no extras</text>
<text x="842.5" y="192" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#55637a" text-anchor="middle">read-only filesystem</text>
<line x1="278" y1="165" x2="379" y2="165" stroke="#c62828" stroke-width="3" stroke-dasharray="9 6" marker-end="url(#ah-red)"/>
<circle cx="328" cy="165" r="14" fill="#c62828"/><path d="M322,159 L334,171 M334,159 L322,171" stroke="#fff" stroke-width="3.4" stroke-linecap="round"/>
<line x1="620" y1="165" x2="722" y2="165" stroke="#15803d" stroke-width="3" marker-end="url(#ah-green)"/>
<text x="500" y="268" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#55637a" text-anchor="middle" font-style="italic">The rules apply when a Pod is created. A Deployment can exist while its Pods are refused.</text>
<rect x="40" y="292" width="920" height="52" rx="12" fill="#e8f0fe" stroke="#1d63ed" stroke-width="2"/>
<text x="62" y="311" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1d63ed" text-anchor="start">THE IDEA</text>
<text x="62" y="331" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#0f1f3d" text-anchor="start">securityContext is what the Pod asks for. Pod Security is what the namespace allows. They have to agree.</text>
<rect x="40" y="352" width="920" height="52" rx="12" fill="#e7f6ec" stroke="#15803d" stroke-width="2"/>
<text x="62" y="371" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#15803d" text-anchor="start">YOU WILL SEE</text>
<text x="62" y="391" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#0f1f3d" text-anchor="start">The insecure Pod is refused with a list of what is missing. The hardened Deployment is admitted.</text>
</svg>
