# Project 1, phase 6: the autoscaler. It watches CPU against what the Pods REQUESTED (50m).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: canteen
  namespace: canteen
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: canteen
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 30     # short, so the class does not wait five minutes to see it shrink
