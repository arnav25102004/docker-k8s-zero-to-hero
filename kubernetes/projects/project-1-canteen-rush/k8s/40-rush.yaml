# Project 1, phase 6: the lunch rush. Starts with 0 customers; you scale it up to cause traffic.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rush
  namespace: canteen
  labels: { app: rush, project: canteen-rush }
spec:
  replicas: 0
  selector:
    matchLabels: { app: rush }
  template:
    metadata:
      labels: { app: rush, project: canteen-rush }
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: customer
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              # Each customer keeps asking one counter to work hard (burn 1 second of CPU), over and over.
              while true; do
                wget -q -T 5 -O /dev/null "http://canteen/api/burn?seconds=1" || sleep 1
              done
          resources:
            requests: { cpu: 5m, memory: 8Mi }
            limits: { memory: 32Mi }
