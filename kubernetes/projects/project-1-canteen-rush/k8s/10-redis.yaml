# Project 1, phase 4: orders live here, so every counter (Pod) sees the same numbers.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: canteen
  labels: { app: redis, project: canteen-rush }
spec:
  replicas: 1
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis, project: canteen-rush }
    spec:
      enableServiceLinks: false
      containers:
        - name: redis
          image: redis:7.4.12-alpine
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { memory: 96Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: canteen
  labels: { app: redis, project: canteen-rush }
spec:
  selector: { app: redis }
  ports:
    - port: 6379
      targetPort: 6379
