apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "canteen.fullname" . }}
  labels:
    {{- include "canteen.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "canteen.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        {{- include "canteen.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: web
    spec:
      enableServiceLinks: false
      containers:
        - name: canteen
          image: {{ include "canteen.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "canteen.secretName" . }}
                  key: admin-token
            {{- if .Values.redis.enabled }}
            - name: REDIS_HOST
              value: {{ include "canteen.fullname" . }}-redis
            {{- end }}
          volumeMounts:
            - name: menu
              mountPath: /etc/canteen
              readOnly: true
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 3
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: menu
          configMap:
            name: {{ include "canteen.fullname" . }}-menu
