{{- if not .Values.existingSecret }}
# Created only when you did not bring your own Secret. Values are base64, which is NOT encryption.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "canteen.secretName" . }}
  labels:
    {{- include "canteen.labels" . | nindent 4 }}
type: Opaque
stringData:
  admin-token: {{ required "set adminToken, or point existingSecret at a Secret" .Values.adminToken | quote }}
{{- end }}
